name: Parallel Parquet stack refresh
on:
  push:
    branches:
      - daipayan/parallel-max-row-group-bytes-review-validation
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: parallel-parquet-stack-${{ github.sha }}
  cancel-in-progress: false
jobs:
  validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      RUSTUP_TOOLCHAIN: 1.99.0
      RUST_BACKTRACE: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: apache/datafusion
          ref: 2566bc1052b32cce327b11d196a4dade52dd57d8
          path: engine
          submodules: true
      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y protobuf-compiler
          rustup toolchain install 1.99.0 --profile minimal --component clippy,rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: engine -> ../target
          shared-key: parallel-parquet-stack-199
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Validate every stage before committing the refreshed branches
        run: python3 control/stack-validation/validate_stack.py engine control validation-results
      - name: Preserve validation results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: parallel-parquet-stack-validation
          path: validation-results
          retention-days: 30
  benchmarks:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      TOKIO_WORKER_THREADS: 4
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: apache/datafusion
          ref: 2566bc1052b32cce327b11d196a4dade52dd57d8
          path: engine
      - name: Install dependencies
        run: |
          rustup toolchain install 1.99.0 --profile minimal
          python3 -m venv metadata-venv
          metadata-venv/bin/python -m pip install pyarrow==25.0.1
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: engine -> ../target
          shared-key: parallel-parquet-stack-bench-199
          cache-on-failure: true
          cache-workspace-crates: true
      - name: Compare upstream, prerequisites, and byte-target implementation
        run: metadata-venv/bin/python control/benchmark-validation/run_stack.py engine benchmark-results all
      - name: Preserve benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: parallel-parquet-stack-benchmarks
          path: benchmark-results/reports
          retention-days: 30
