name: Parallel Parquet comparison

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comparison:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      TOKIO_WORKER_THREADS: 4
      RUSTUP_TOOLCHAIN: 1.97.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: control
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 5bf6aef8e37c91d882c0f75b772201d62733c88f
          path: engine
      - name: Install toolchain and metadata reader
        run: |
          rustup toolchain install 1.97.0 --profile minimal
          python3 -m venv metadata-venv
          metadata-venv/bin/python -m pip install pyarrow
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: engine -> ../target
          shared-key: parallel-parquet-197
      - name: Build and compare on the same machine
        run: metadata-venv/bin/python control/benchmark-validation/run.py engine results
      - name: Preserve logs and measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: parallel-parquet-comparison
          path: results/reports
          retention-days: 7
